<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      id="seo-description"
      name="description"
      content="Frontend training project for building a Digikala homepage clone."
    />
    <meta id="seo-keywords" name="keywords" content="" />
    <title>DigiKala</title>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body class="bg-white text-[#0c0c0c]">
    <header
      class="mx-auto inline-block w-full max-w-[1800px] border-b border-[#e5e7eb] bg-white"
    >
      <h1 id="header-heading" class="sr-only"></h1>

      <div id="header-banner" class="header-banner w-full"></div>

      <div class="w-full px-4 lg:px-6">
        <div class="flex flex-wrap items-center justify-between gap-y-3 py-2.5 lg:flex-nowrap lg:gap-5">
          <div class="flex min-w-0 items-center gap-3 lg:gap-5">
            <button
              id="mobile-menu-toggle"
              type="button"
              class="flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center rounded-lg hover:bg-[#f5f5f5] lg:hidden"
              aria-label="نمایش منو"
              aria-controls="mobile-menu-panel"
              aria-expanded="false"
            >
              <img
                class="h-6 w-6"
                src="/assets/images/header/Navbar/Burger.svg"
                alt=""
              />
            </button>

            <a id="header-logo" class="block shrink-0" href="/" aria-label="صفحه اصلی"></a>
          </div>

          <div
            class="order-3 flex h-11 w-full items-center gap-2 rounded-3xl bg-[#ecedef] px-4 lg:order-0 lg:ml-auto lg:max-w-125"
          >
            <img
              class="h-6 w-6 shrink-0"
              src="/assets/images/header/search-logo.svg"
              alt=""
            />
            <input
              type="text"
              placeholder="جستجو"
              aria-label="جستجو"
              class="h-6.5 min-w-0 flex-1 bg-transparent px-2 text-[16px] leading-6.5 text-[#565756] outline-none"
            />
          </div>

          <div class="flex shrink-0 items-center">
            <a class="hidden p-2 sm:block" href="#" aria-label="اعلان‌ها">
              <img
                class="h-6 w-6"
                src="/assets/images/header/header-notif.svg"
                alt=""
              />
            </a>

            <button
              type="button"
              class="flex h-10 cursor-pointer items-center gap-2 rounded-lg border-[0.666667px] border-[#dadada] bg-white px-2 py-2 sm:px-4"
            >
              <img
                class="h-6 w-6"
                src="/assets/images/header/header-register.svg"
                alt=""
              />
              <span class="hidden text-[15px] sm:inline">ورود | ثبت‌نام</span>
            </button>

            <span class="mx-2 h-6.5 w-px bg-[#d6d5d5] sm:mx-3"></span>

            <button
              type="button"
              class="flex cursor-pointer items-center gap-2 p-2"
              aria-label="سبد خرید"
            >
              <img
                class="h-6 w-6"
                src="/assets/images/header/header-shopping-card.svg"
                alt=""
              />
            </button>
          </div>
        </div>

        <div
          id="mobile-menu-panel"
          class="border-t border-[#e0e0e2] py-3 lg:hidden"
          hidden
        >
          <nav id="mobile-menu" aria-label="منوی اصلی موبایل"></nav>
          <button
            type="button"
            class="mt-3 flex w-full cursor-pointer items-center gap-2 rounded-lg bg-[#fff4ed] px-3 py-2 text-[#f57f17]"
          >
            <img
              class="h-5 w-5"
              src="/assets/images/header/location-pin.svg"
              alt=""
            />
            <span class="text-[15px]">انتخاب آدرس</span>
          </button>
        </div>

        <div class="hidden h-12 items-center justify-between lg:flex">
          <nav
            id="desktop-menu"
            class="header-navbar flex h-full min-w-0 items-center gap-3 font-yekan text-[15px]"
            aria-label="منوی اصلی"
          ></nav>

          <button
            type="button"
            class="mr-5 flex h-10 shrink-0 cursor-pointer items-center gap-2 rounded-full bg-[#fff4ed] px-3 py-1 text-[#f57f17]"
          >
            <img
              class="h-5 w-5"
              src="/assets/images/header/location-pin.svg"
              alt=""
            />
            <span class="text-[15px]">انتخاب آدرس</span>
          </button>
        </div>
      </div>
    </header>

    <script type="module" src="/src/ts/main.ts"></script>
  </body>
</html>
